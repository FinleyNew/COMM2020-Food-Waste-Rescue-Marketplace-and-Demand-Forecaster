# The name shown in the GitHub Actions UI
name: CI

# --- TRIGGERS ---
# This pipeline runs whenever code is pushed to any branch,
# or when a pull request is opened/updated targeting main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# --- JOBS ---
# Jobs run in parallel by default
jobs:
  # Python / FastAPI backend tests
  backend:
    runs-on: ubuntu-latest  # The virtual machine GitHub provides

    steps:
      # Step 1: Check out your repo's code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Python (uses a community-maintained Action)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Step 3: Install your dependencies
      # Adjust the path if your backend is in a subdirectory (e.g. ./backend)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # Step 4: Run your tests with pytest
      - name: Run tests
        run: pytest backend/

  docker-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start containers
        run: docker compose up -d --build
        # -d runs in detached mode (background)
        # --build forces a fresh image build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for containers to be healthy..."
          for i in {1..30}; do
            if docker compose ps | grep -E "(unhealthy|starting)" > /dev/null; then
              echo "Still waiting... ($i/30)"
              sleep 3
            else
              echo "All services ready"
              docker compose ps
              exit 0
            fi
          done
          echo "Timed out waiting for services"
          docker compose logs
          exit 1
          
      - name: Check no containers have exited
        run: |
          if docker compose ps --status exited | grep -E "app|frontend|db"; then
            echo "One or more containers exited unexpectedly"
            docker compose logs
            exit 1
          fi

      - name: Check all containers are still running
        run: |
          docker compose ps --status running | grep app
          docker compose ps --status running | grep frontend
          docker compose ps --status running | grep db

      - name: Tear down
        if: always()  # runs even if a previous step failed
        run: docker compose down
