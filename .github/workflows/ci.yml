# The name shown in the GitHub Actions UI
name: CI

# --- TRIGGERS ---
# This pipeline runs whenever code is pushed to any branch,
# or when a pull request is opened/updated targeting main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

# --- JOBS ---
# Jobs run in parallel by default
jobs:
  # Python / FastAPI backend tests
  backend-tests:
    runs-on: ubuntu-latest  # The virtual machine GitHub provides

    steps:
      # Check out repo code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Install your dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # Step 4: Run your tests with pytest
      - name: Run tests
        run: pytest backend/ --json-report --json-report-file=test_results.json

      - name: Commit test results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add test_results.json
          git diff --staged --quiet || git commit -m "Update test results"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start containers
        run: docker compose up -d --build
        # -d runs in detached mode
        # --build forces a fresh image build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for containers to be healthy..."
          for i in {1..30}; do
            if docker compose ps | grep -E "(unhealthy|starting)" > /dev/null; then
              echo "Still waiting... ($i/30)"
              sleep 3
            else
              echo "All services ready"
              docker compose ps
              exit 0
            fi
          done
          echo "Timed out waiting for services"
          docker compose logs
          exit 1
          
      - name: Check no containers have exited
        run: |
          if docker compose ps --status exited | grep -E "app|frontend|db"; then
            echo "One or more containers exited unexpectedly"
            docker compose logs
            exit 1
          fi

      - name: Check all containers are still running
        run: |
          docker compose ps --status running | grep app
          docker compose ps --status running | grep frontend
          docker compose ps --status running | grep db

      - name: Tear down
        if: always()  # runs even if a previous step failed
        run: docker compose down
